name: Python tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "python-dotenv>=1,<2"
      - name: Compile all Python modules
        run: python -m compileall -q angela tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-voice-import:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local-voice dependencies
        run: python -m pip install -r requirements-voice-kokoro.txt
      - name: Compile GUI and wake modules
        run: python -m compileall -q angela tests
      - name: Check Windows discovery (read-only)
        shell: pwsh
        run: |
          @'
          from angela.windows_apps import WindowsAppCatalog
          from angela.windows_windows import enumerate_windows
          from angela.windows_folders import folder_from_text
          apps = WindowsAppCatalog().list_apps()
          print("Registered apps:", len(apps))
          print("Visible windows:", len(enumerate_windows()))
          assert folder_from_text("Abra a pasta Imagens no SSD D") == r"D:\Imagens"
          '@ | Set-Content -Path smoke_windows.py -Encoding utf8
          python smoke_windows.py
      - name: Check Brazilian Portuguese phonemization
        shell: pwsh
        run: |
          @'
          from misaki.espeak import EspeakG2P
          from kokoro_onnx import Kokoro
          g2p = EspeakG2P(language="pt-br")
          phonemes, _ = g2p("Olá, Ângela. Teste de voz feminina.")
          if not phonemes:
              raise RuntimeError("No phonemes returned")
          print("Portuguese G2P available; model loading requires downloaded assets.")
          '@ | Set-Content -Path voice_smoke.py -Encoding utf8
          python voice_smoke.py
