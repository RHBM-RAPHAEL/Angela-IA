<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ângela AI · Núcleo holográfico</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
#angela-panel{position:fixed;right:24px;top:12%;width:300px;max-height:65vh;box-sizing:border-box;padding:16px 18px;border:1px solid rgba(87,190,255,.55);border-radius:15px;background:rgba(5,15,32,.91);color:#e8f5ff;font:14px 'Segoe UI',Arial,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.28);overflow:hidden;opacity:0;transform:translateX(20px);transition:opacity .25s,transform .25s;pointer-events:none}
#angela-panel.visible{opacity:1;transform:translateX(0)}
#angela-panel h2{font-size:15px;font-weight:600;margin:0 0 8px;color:#7bd6ff}
#angela-panel .count{font-size:12px;color:#a7bacc;margin-bottom:10px}
#angela-panel ul{list-style:none;padding:0;margin:0;max-height:47vh;overflow:hidden}
#angela-panel li{padding:5px 0;border-bottom:1px solid rgba(140,190,220,.13);overflow-wrap:anywhere}
#angela-panel .more{font-size:12px;color:#a7bacc;padding-top:8px}
</style>
</head>
<body>
<div id="scene"></div>

<aside id="angela-panel" aria-live="polite"><h2 id="panel-title"></h2><div class="count" id="panel-count"></div><ul id="panel-list"></ul><div class="more" id="panel-more"></div></aside>
<script type="module" src="./orb.js"></script>
</body>
</html>
